# Deterministic checks on every pull request and every push to main (0007).
# Live-model runs never run in CI.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Lint, type check and test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      FIVEFOLD_ADMIN_DSN: postgresql://postgres@127.0.0.1:5432/postgres
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv==0.13.8
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Install the pinned Temporal CLI
        run: make temporal-setup check-temporal
      - name: Lint
        run: make lint
      - name: Type check
        run: make typecheck
      - name: Test
        run: make test

  packaging:
    name: Installed wheel demo
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      FIVEFOLD_ADMIN_DSN: postgresql://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv==0.13.8
      - name: Build the sdist and wheel
        run: uv build --out-dir dist
      - name: Check the PyPI description
        run: |
          python -m pip install twine==7.0.0 'readme-renderer[md]==46.0'
          python -m twine check --strict dist/*
          python scripts/check_pypi_readme.py dist/*.whl dist/*.tar.gz
      - name: Run demo 1 from the installed wheel outside the checkout
        run: |
          smoke=$(mktemp -d)
          uv venv --python 3.12 "$smoke/venv"
          uv pip install --python "$smoke/venv/bin/python" dist/*.whl
          cd "$smoke"
          "$smoke/venv/bin/python" -m fivefold.harness.demo 1

  identities:
    name: Commit identities
    # Every commit of a pull request must use GitHub noreply addresses (CLAUDE.md,
    # "Commits and attribution"). The check never prints what it refuses.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check every commit's author and committer
        run: python3 scripts/check_identities.py "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  viewer:
    name: Viewer build, lint and test
    # The viewer's frontend (0012) on Node's current LTS line; the Python jobs never need Node.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26.13.1"
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Type check and build
        run: npm run build

  container:
    name: Compose file and app image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate the Compose file, with each profile
        run: |
          docker compose config --quiet
          docker compose --profile app config --quiet
          docker compose --profile viewer config --quiet
          docker compose --profile split config --quiet
      - name: Build the app image
        run: docker build .
      - name: Build the viewer image
        run: docker build --file viewer/Dockerfile .
