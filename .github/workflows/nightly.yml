# Nightly property tests with far more examples than CI (0007) and the larger gateway
# model check (0021). Hypothesis prints a
# reproduction blob for every failure, and the job uploads its example database.
name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  properties:
    name: Property tests (nightly profile)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      FIVEFOLD_ADMIN_DSN: postgresql://postgres@127.0.0.1:5432/postgres
      HYPOTHESIS_PROFILE: nightly
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv==0.13.8
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Install the pinned Temporal CLI
        run: make temporal-setup check-temporal
      - name: Test
        run: make test
      - name: Upload failing examples
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hypothesis-examples
          path: .hypothesis/
          if-no-files-found: ignore

  gateway-model:
    name: Gateway model (nightly profile)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv==0.13.8
      - name: Install locked dependencies
        run: uv sync --locked
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-package: jre
          java-version: '17.0.19+10'
      - name: Verify Java and install the pinned TLC jar
        run: |
          java -version
          make tla-setup
      - name: Check the larger gateway model
        run: make tla-nightly
