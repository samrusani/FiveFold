# Publishes FiveFold to PyPI when a GitHub release is published, through PyPI's
# Trusted Publishing: no token is stored anywhere. The build job checks that the
# release's tag and pre-release flag match the version in pyproject.toml, builds
# both distributions, verifies their descriptions and installs each in a fresh
# environment. It runs demo 1 from the wheel outside the checkout. The publish job runs in the GitHub
# environment `pypi`, whose protection rules apply before anything is published.
name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build and check the distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      FIVEFOLD_ADMIN_DSN: postgresql://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv==0.13.8 packaging==26.3
      - name: Check that the release tag and flag match the package's version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          tag="${GITHUB_REF#refs/tags/}"
          if [ "$tag" != "v$version" ]; then
            echo "The release tag is $tag, but pyproject.toml says version $version: tag the release v$version."
            exit 1
          fi
          # https://docs.github.com/en/webhooks/webhook-events-and-payloads#release
          python - "$version" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          from packaging.version import Version

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          version = Version(sys.argv[1])
          expected = version.is_prerelease
          if event.get("release", {}).get("prerelease") is not expected:
              raise SystemExit(f"Version {version} requires GitHub release.prerelease={str(expected).lower()}.")
          PY
      - name: Build the sdist and the wheel
        run: uv build --out-dir dist
      - name: Check both PyPI descriptions
        run: |
          python -m pip install twine==7.0.0 'readme-renderer[md]==46.0'
          python -m twine check --strict dist/*.whl dist/*.tar.gz
          python scripts/check_pypi_readme.py dist/*.whl dist/*.tar.gz
      - name: Install the source distribution outside the repository
        run: |
          smoke=$(mktemp -d)
          sdist=$(realpath dist/*.tar.gz)
          cd "$smoke"
          uv venv --python 3.12 "$smoke/venv"
          uv pip install --python "$smoke/venv/bin/python" "$sdist"
          "$smoke/venv/bin/python" -m fivefold.harness.demo --help
      - name: Run demo 1 from the installed wheel, outside the repository
        run: |
          smoke=$(mktemp -d)
          uv venv --python 3.12 "$smoke/venv"
          uv pip install --python "$smoke/venv/bin/python" dist/*.whl
          cd "$smoke"
          "$smoke/venv/bin/python" -m fivefold.harness.demo 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/fivefold
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
