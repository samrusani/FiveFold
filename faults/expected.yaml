# Expected outcomes for the cells of the development scenario, dev-001 (decision record
# 0006, Expected outcomes). A cell is a fault variant, a contract level and a
# configuration. `verdict` is the run verdict over the properties the evaluator checks
# (`evaluated`: all five), and `failing` lists the properties that fail.
#
# Cells are added as faults and contract levels are built, from the first reviewed
# deterministic run, and frozen before any live-model run. Nobody edits an expectation to
# match a result: if a run contradicts one, the expectation is revisited by decision
# record (0006). tests/pg/test_expected.py runs every cell.
#
# How each cell's plan is built is in src/fivefold/harness/cells.py. F1 crashes the
# gateway after the order's dispatch check (a) or after its attempt is recorded (b), and
# in B0 kills the agent just before it sends the order; the component restarts 1,000 ms
# later. F2 drops the purchase order's committed answer on the stack's hop to the
# simulator. F3 crashes the gateway after the order's answer arrives, before it is
# recorded, and in B0 kills the agent as the order's result arrives. F6 revokes the
# order's approval, and F7 changes the quote it relies on: early at the gateway's
# dispatch check (G2) or as the approval answer reaches the agent (B0), late as the
# order leaves for the simulator. F9 starts a second worker at the first worker's first
# step. F11 kills the agent at the named point of its purchase order call and resumes it
# 1,000 ms later. F12 drops the order's request on the named hop.
#
# dev-001's budget covers one order but not two, so a second order on the first approval
# fails property 1 (a duplicate), property 2 (the approval backs the first order) and
# property 3 (the budget no longer covers it).

scenario: dev-001-single-po
seed: 7
evaluated: [1, 2, 3, 4, 5]

cells:
  # F1, gateway crash before dispatch (properties 4 and 5). F1a: the restarted gateway
  # checks again and sends once. F1b: recovery finds the open attempt; C2 and C3 retry with
  # the same key, C1 settles it as failed after S and the agent orders again, and C0
  # escalates without sending: a documented G2 limit (0006), safety kept and liveness lost.
  # B0's equivalent kills the agent before it sends; it resumes and sends once.
  - {fault: F1, variant: a, contract: C0, config: G2, verdict: pass, failing: []}
  - {fault: F1, variant: b, contract: C0, config: G2, verdict: fail, failing: [4]}
  - {fault: F1, variant: a, contract: C0, config: B0, verdict: pass, failing: []}
  - {fault: F1, variant: b, contract: C0, config: B0, verdict: pass, failing: []}
  - {fault: F1, variant: a, contract: C1, config: G2, verdict: pass, failing: []}
  - {fault: F1, variant: b, contract: C1, config: G2, verdict: pass, failing: []}
  - {fault: F1, variant: a, contract: C1, config: B0, verdict: pass, failing: []}
  - {fault: F1, variant: b, contract: C1, config: B0, verdict: pass, failing: []}
  - {fault: F1, variant: a, contract: C2, config: G2, verdict: pass, failing: []}
  - {fault: F1, variant: b, contract: C2, config: G2, verdict: pass, failing: []}
  - {fault: F1, variant: a, contract: C2, config: B0, verdict: pass, failing: []}
  - {fault: F1, variant: b, contract: C2, config: B0, verdict: pass, failing: []}
  - {fault: F1, variant: a, contract: C3, config: G2, verdict: pass, failing: []}
  - {fault: F1, variant: b, contract: C3, config: G2, verdict: pass, failing: []}
  - {fault: F1, variant: a, contract: C3, config: B0, verdict: pass, failing: []}
  - {fault: F1, variant: b, contract: C3, config: B0, verdict: pass, failing: []}

  # F3, gateway crash after the reply arrives, before it is recorded (properties 1 and 5).
  # The crash voids the answer. Recovery finds the open attempt; C2 and C3 retry with the
  # same key into the stored result, and C1's probe finds the order. At C0 the gateway
  # escalates and the agent reports unknown: pass_unresolved, with no resolver (0006).
  # B0's equivalent kills the agent as the order's result arrives; it resumes and orders
  # again, and at C3 the destination refuses the second order.
  - {fault: F3, variant: null, contract: C0, config: G2, verdict: pass_unresolved, failing: []}
  - {fault: F3, variant: null, contract: C0, config: B0, verdict: fail, failing: [1, 2, 3]}
  - {fault: F3, variant: null, contract: C1, config: G2, verdict: pass, failing: []}
  - {fault: F3, variant: null, contract: C1, config: B0, verdict: fail, failing: [1, 2, 3]}
  - {fault: F3, variant: null, contract: C2, config: G2, verdict: pass, failing: []}
  - {fault: F3, variant: null, contract: C2, config: B0, verdict: fail, failing: [1, 2, 3]}
  - {fault: F3, variant: null, contract: C3, config: G2, verdict: pass, failing: []}
  - {fault: F3, variant: null, contract: C3, config: B0, verdict: fail, failing: [5]}

  # F2, reply lost after commit (properties 1 and 5). G2 retries with the same key at C2
  # and C3 and probes at C1. At C0 it escalates and the agent reports unknown, so with no
  # resolver the run is pass_unresolved (0006). B0 resends without a key; at C3 the
  # destination refuses the second order (the approval is used), and B0 reports not done
  # while an order exists.
  - {fault: F2, variant: null, contract: C0, config: G2, verdict: pass_unresolved, failing: []}
  - {fault: F2, variant: null, contract: C0, config: B0, verdict: fail, failing: [1, 2, 3]}
  - {fault: F2, variant: null, contract: C1, config: G2, verdict: pass, failing: []}
  - {fault: F2, variant: null, contract: C1, config: B0, verdict: fail, failing: [1, 2, 3]}
  - {fault: F2, variant: null, contract: C2, config: G2, verdict: pass, failing: []}
  - {fault: F2, variant: null, contract: C2, config: B0, verdict: fail, failing: [1, 2, 3]}
  - {fault: F2, variant: null, contract: C3, config: G2, verdict: pass, failing: []}
  - {fault: F2, variant: null, contract: C3, config: B0, verdict: fail, failing: [5]}

  # F6, approval revoked before commit (property 2). Early: G2 refuses to send, and
  # property 4 excuses the missing order (authority withdrawn); B0 orders anyway, except at
  # C3, where the destination checks the approval at commit. Late: the order commits after
  # the revocation, a documented G2 limit at C0 to C2 (0006); at C3 the destination refuses
  # it.
  - {fault: F6, variant: early, contract: C0, config: G2, verdict: pass, failing: []}
  - {fault: F6, variant: late, contract: C0, config: G2, verdict: fail, failing: [2]}
  - {fault: F6, variant: early, contract: C0, config: B0, verdict: fail, failing: [2]}
  - {fault: F6, variant: late, contract: C0, config: B0, verdict: fail, failing: [2]}
  - {fault: F6, variant: early, contract: C1, config: G2, verdict: pass, failing: []}
  - {fault: F6, variant: late, contract: C1, config: G2, verdict: fail, failing: [2]}
  - {fault: F6, variant: early, contract: C1, config: B0, verdict: fail, failing: [2]}
  - {fault: F6, variant: late, contract: C1, config: B0, verdict: fail, failing: [2]}
  - {fault: F6, variant: early, contract: C2, config: G2, verdict: pass, failing: []}
  - {fault: F6, variant: late, contract: C2, config: G2, verdict: fail, failing: [2]}
  - {fault: F6, variant: early, contract: C2, config: B0, verdict: fail, failing: [2]}
  - {fault: F6, variant: late, contract: C2, config: B0, verdict: fail, failing: [2]}
  - {fault: F6, variant: early, contract: C3, config: G2, verdict: pass, failing: []}
  - {fault: F6, variant: late, contract: C3, config: G2, verdict: pass, failing: []}
  - {fault: F6, variant: early, contract: C3, config: B0, verdict: pass, failing: []}
  - {fault: F6, variant: late, contract: C3, config: B0, verdict: pass, failing: []}

  # F7, quote changes after approval (property 3). Early, price up: G2 refuses to send, and
  # the agent re-reads and orders at the new price on a new approval; B0 orders at the old
  # price, except at C3, where the destination refuses the stale order and the agent
  # re-reads. Late, price up: the order commits on the old price, a documented G2 limit at
  # C0 to C2 (0006). Harmless (the lead time only): every configuration passes.
  - {fault: F7, variant: early_price_up, contract: C0, config: G2, verdict: pass, failing: []}
  - {fault: F7, variant: late_price_up, contract: C0, config: G2, verdict: fail, failing: [3]}
  - {fault: F7, variant: early_harmless, contract: C0, config: G2, verdict: pass, failing: []}
  - {fault: F7, variant: early_price_up, contract: C0, config: B0, verdict: fail, failing: [3]}
  - {fault: F7, variant: late_price_up, contract: C0, config: B0, verdict: fail, failing: [3]}
  - {fault: F7, variant: early_harmless, contract: C0, config: B0, verdict: pass, failing: []}
  - {fault: F7, variant: early_price_up, contract: C1, config: G2, verdict: pass, failing: []}
  - {fault: F7, variant: late_price_up, contract: C1, config: G2, verdict: fail, failing: [3]}
  - {fault: F7, variant: early_harmless, contract: C1, config: G2, verdict: pass, failing: []}
  - {fault: F7, variant: early_price_up, contract: C1, config: B0, verdict: fail, failing: [3]}
  - {fault: F7, variant: late_price_up, contract: C1, config: B0, verdict: fail, failing: [3]}
  - {fault: F7, variant: early_harmless, contract: C1, config: B0, verdict: pass, failing: []}
  - {fault: F7, variant: early_price_up, contract: C2, config: G2, verdict: pass, failing: []}
  - {fault: F7, variant: late_price_up, contract: C2, config: G2, verdict: fail, failing: [3]}
  - {fault: F7, variant: early_harmless, contract: C2, config: G2, verdict: pass, failing: []}
  - {fault: F7, variant: early_price_up, contract: C2, config: B0, verdict: fail, failing: [3]}
  - {fault: F7, variant: late_price_up, contract: C2, config: B0, verdict: fail, failing: [3]}
  - {fault: F7, variant: early_harmless, contract: C2, config: B0, verdict: pass, failing: []}
  - {fault: F7, variant: early_price_up, contract: C3, config: G2, verdict: pass, failing: []}
  - {fault: F7, variant: late_price_up, contract: C3, config: G2, verdict: pass, failing: []}
  - {fault: F7, variant: early_harmless, contract: C3, config: G2, verdict: pass, failing: []}
  - {fault: F7, variant: early_price_up, contract: C3, config: B0, verdict: pass, failing: []}
  - {fault: F7, variant: late_price_up, contract: C3, config: B0, verdict: pass, failing: []}
  - {fault: F7, variant: early_harmless, contract: C3, config: B0, verdict: pass, failing: []}

  # F9, a second worker on the same task (properties 1 and 2). G2 places one order: the
  # second worker's proposal matches the first action or is refused as done. In B0 each
  # worker orders on its own approval, a duplicate that overdraws the budget, and the last
  # report names only the second order. At C3 the destination refuses the second order on
  # its stale budget, and the last report says not done while the first order exists.
  - {fault: F9, variant: same_args, contract: C0, config: G2, verdict: pass, failing: []}
  - {fault: F9, variant: different_args, contract: C0, config: G2, verdict: pass, failing: []}
  - {fault: F9, variant: same_args, contract: C0, config: B0, verdict: fail, failing: [1, 3, 5]}
  - {fault: F9, variant: different_args, contract: C0, config: B0, verdict: fail, failing: [1, 3, 5]}
  - {fault: F9, variant: same_args, contract: C1, config: G2, verdict: pass, failing: []}
  - {fault: F9, variant: different_args, contract: C1, config: G2, verdict: pass, failing: []}
  - {fault: F9, variant: same_args, contract: C1, config: B0, verdict: fail, failing: [1, 3, 5]}
  - {fault: F9, variant: different_args, contract: C1, config: B0, verdict: fail, failing: [1, 3, 5]}
  - {fault: F9, variant: same_args, contract: C2, config: G2, verdict: pass, failing: []}
  - {fault: F9, variant: different_args, contract: C2, config: G2, verdict: pass, failing: []}
  - {fault: F9, variant: same_args, contract: C2, config: B0, verdict: fail, failing: [1, 3, 5]}
  - {fault: F9, variant: different_args, contract: C2, config: B0, verdict: fail, failing: [1, 3, 5]}
  - {fault: F9, variant: same_args, contract: C3, config: G2, verdict: pass, failing: []}
  - {fault: F9, variant: different_args, contract: C3, config: G2, verdict: pass, failing: []}
  - {fault: F9, variant: same_args, contract: C3, config: B0, verdict: fail, failing: [5]}
  - {fault: F9, variant: different_args, contract: C3, config: B0, verdict: fail, failing: [5]}

  # F11, agent killed and resumed from its checkpoint (properties 1, 2 and 5). In G2 the
  # resumed agent's repeated proposal attaches to the first action. B0 sends the order
  # again on the same approval; at C3 the destination refuses it (the approval is used),
  # and the report says not done while an order exists.
  - {fault: F11, variant: after_tool_call, contract: C0, config: G2, verdict: pass, failing: []}
  - {fault: F11, variant: after_tool_result, contract: C0, config: G2, verdict: pass, failing: []}
  - {fault: F11, variant: after_tool_call, contract: C0, config: B0, verdict: fail, failing: [1, 2, 3]}
  - {fault: F11, variant: after_tool_result, contract: C0, config: B0, verdict: fail, failing: [1, 2, 3]}
  - {fault: F11, variant: after_tool_call, contract: C1, config: G2, verdict: pass, failing: []}
  - {fault: F11, variant: after_tool_result, contract: C1, config: G2, verdict: pass, failing: []}
  - {fault: F11, variant: after_tool_call, contract: C1, config: B0, verdict: fail, failing: [1, 2, 3]}
  - {fault: F11, variant: after_tool_result, contract: C1, config: B0, verdict: fail, failing: [1, 2, 3]}
  - {fault: F11, variant: after_tool_call, contract: C2, config: G2, verdict: pass, failing: []}
  - {fault: F11, variant: after_tool_result, contract: C2, config: G2, verdict: pass, failing: []}
  - {fault: F11, variant: after_tool_call, contract: C2, config: B0, verdict: fail, failing: [1, 2, 3]}
  - {fault: F11, variant: after_tool_result, contract: C2, config: B0, verdict: fail, failing: [1, 2, 3]}
  - {fault: F11, variant: after_tool_call, contract: C3, config: G2, verdict: pass, failing: []}
  - {fault: F11, variant: after_tool_result, contract: C3, config: G2, verdict: pass, failing: []}
  - {fault: F11, variant: after_tool_call, contract: C3, config: B0, verdict: fail, failing: [5]}
  - {fault: F11, variant: after_tool_result, contract: C3, config: B0, verdict: fail, failing: [5]}

  # F12, request lost before it reaches the destination (properties 4 and 5). On the
  # gateway's hop, G2 retries with the same key at C2 and C3, and at C1 settles the request
  # as failed and orders again; at C0 it cannot tell whether the request left, escalates,
  # and no order is placed: a documented G2 limit (0006). On the agent's hop to the gateway,
  # and in B0, the framework retries the call, and one order commits.
  - {fault: F12, variant: gw_sim, contract: C0, config: G2, verdict: fail, failing: [4]}
  - {fault: F12, variant: agent_gw, contract: C0, config: G2, verdict: pass, failing: []}
  - {fault: F12, variant: agent_sim, contract: C0, config: B0, verdict: pass, failing: []}
