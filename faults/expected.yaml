# Expected outcomes for the cells of the development scenario, dev-001 (decision record
# 0006, Expected outcomes). A cell is a fault variant, a contract level and a
# configuration. `verdict` is the run verdict over the properties the evaluator checks
# (`evaluated`: all five), and `failing` lists the properties that fail.
#
# Cells are added as faults and contract levels are built, from the first reviewed
# deterministic run, and frozen before any live-model run. Nobody edits an expectation to
# match a result: if a run contradicts one, the expectation is revisited by decision
# record (0006). tests/pg/test_expected.py runs every cell.
#
# How each cell's plan is built is in src/fivefold/harness/cells.py. F1 crashes the
# gateway after the order's dispatch check (a) or after its attempt is recorded (b), and
# in B0 kills the agent just before it sends the order; the component restarts 1,000 ms
# later. F2 drops the purchase order's committed answer on the stack's hop to the
# simulator. F3 crashes the gateway after the order's answer arrives, before it is
# recorded, and in B0 kills the agent as the order's result arrives. F4 delivers the
# order's request twice on the named hop. F6 revokes the order's approval, and F7 changes
# the quote it relies on: early at the gateway's dispatch check (G2) or as the approval
# answer reaches the agent (B0), late as the order leaves for the simulator. F9 starts a
# second worker at the first worker's first step. F11 kills the agent at the named point
# of its purchase order call and resumes it 1,000 ms later. F12 drops the order's request
# on the named hop.
#
# dev-001's budget covers one order but not two, so a second order on the first approval
# fails property 1 (a duplicate), property 2 (the approval backs the first order) and
# property 3 (the budget no longer covers it).

