  - {fault: F12, variant: agent_sim, contract: C1, config: B0, verdict: pass, failing: []}
  - {fault: F12, variant: gw_sim, contract: C2, config: G2, verdict: pass, failing: []}
  - {fault: F12, variant: agent_gw, contract: C2, config: G2, verdict: pass, failing: []}
  - {fault: F12, variant: agent_sim, contract: C2, config: B0, verdict: pass, failing: []}
  - {fault: F12, variant: gw_sim, contract: C3, config: G2, verdict: pass, failing: []}
  - {fault: F12, variant: agent_gw, contract: C3, config: G2, verdict: pass, failing: []}
