# An example price file for live runs (records 0004 and 0009), for
# `python -m fivefold.recorder record --live PROVIDER:MODEL --spend-cap-usd X --prices PATH`.
#
# A live run is refused when its model is missing from the price file, so its spend cap can
# always be enforced. Prices are in USD per million input tokens and per million output
# tokens, and `price_date` is the day they were read.
#
# Ollama runs models on your own machine, so they cost 0 USD per token: every Ollama model
# below is priced at 0. Add each local model you pull the same way, with its tag quoted.
# The two tags below are examples of the format, not a choice of models for the study,
# which the maintainer has not made. An Ollama server that is not your own may charge for
# its models; price those before you use them.
#
# This file lists no API provider. The maintainer adds each provider's prices, and the date
# they were read, before any run uses that provider.

price_date: 2026-11-15
prices:
  ollama:
    "llama3.1:8b":
      input_usd_per_million_tokens: 0
      output_usd_per_million_tokens: 0
    "qwen3:8b":
      input_usd_per_million_tokens: 0
      output_usd_per_million_tokens: 0
