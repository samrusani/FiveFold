[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme==25.1.0"]
build-backend = "hatchling.build"

[project]
name = "fivefold"
version = "0.2.1"
description = "A test suite and reference gateway that checks whether AI agents act correctly when things fail."
dynamic = ["readme"]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.7",
    "httpx==0.28.1",
    "langchain-anthropic==1.7.10",
    "langchain-google-genai==4.5.0",
    "langchain-ollama==1.1.0",
    "langchain-openai==1.8.0",
    "langgraph==1.2.22",
    "langgraph-checkpoint-postgres==3.2.1",
    "langgraph-prebuilt==1.1.2",
    "mcp==2.3.0",
    "psycopg[binary]>=3.3.9,<3.4",
    "pydantic>=2.14.3,<3",
    "pyyaml>=6.0.3,<7",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
]

[project.urls]
Repository = "https://github.com/samrusani/FiveFold"
Issues = "https://github.com/samrusani/FiveFold/issues"

[project.optional-dependencies]
dbos = ["dbos==3.6.0"]
temporal = ["temporalio==1.36.1"]

[dependency-groups]
dev = [
    "dbos==3.6.0",
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff==0.17.5",
    "temporalio==1.36.1",
    "types-pyyaml>=6.0.12",
]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

# Rewrite images first. The second rule also covers links around badges.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(!\[[^\]\n]*\]\()((?![a-zA-Z][a-zA-Z0-9+.-]*:|/|#)[^\s)]+)\)'
replacement = '\1https://raw.githubusercontent.com/samrusani/FiveFold/v$HFPR_VERSION/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\(((?![a-zA-Z][a-zA-Z0-9+.-]*:|/|#)[^\s)]+)\)'
replacement = '](https://github.com/samrusani/FiveFold/blob/v$HFPR_VERSION/\1)'

[tool.hatch.build.targets.sdist]
exclude = ["/results", "/.tla"]

[tool.hatch.build.targets.wheel]
packages = ["src/fivefold"]

[tool.hatch.build.targets.wheel.force-include]
"db" = "fivefold/_data/db"
"scenarios/dev" = "fivefold/_data/scenarios/dev"
"faults/expected.yaml" = "fivefold/_data/faults/expected.yaml"
"faults/expected-f8.yaml" = "fivefold/_data/faults/expected-f8.yaml"

# Lint and format (0007). Ruff's version is pinned so lint results do not drift.
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "DTZ", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["fivefold"]

# Determinism guard (0007, 0009): only harness/clock.py and harness/rng.py may touch
# wall-clock time or system randomness. Everything else uses the run's virtual clock
# and seeded generators.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"time".msg = "Use the run's virtual clock in fivefold.harness.clock."
"asyncio.sleep".msg = "Use the scheduler's timers; wall-clock waits break determinism."
"datetime.datetime.now".msg = "Use the run's virtual clock in fivefold.harness.clock."
"datetime.datetime.utcnow".msg = "Use the run's virtual clock in fivefold.harness.clock."
"datetime.datetime.today".msg = "Use the run's virtual clock in fivefold.harness.clock."
"datetime.date.today".msg = "Use the run's virtual clock in fivefold.harness.clock."
"random".msg = "Use the run's seeded generators in fivefold.harness.rng."
"secrets".msg = "Use the run's seeded generators in fivefold.harness.rng."
"uuid.uuid1".msg = "Use per-run counters for ids (0009)."
"uuid.uuid4".msg = "Use per-run counters for ids (0009)."
"os.urandom".msg = "Use the run's seeded generators in fivefold.harness.rng."

[tool.ruff.lint.per-file-ignores]
"src/fivefold/harness/clock.py" = ["TID251"]
"src/fivefold/harness/rng.py" = ["TID251"]
"tests/**" = ["TID251"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
markers = [
    "pg: needs a PostgreSQL 16 server; set FIVEFOLD_ADMIN_DSN (default: the local Docker Compose database)",
]
